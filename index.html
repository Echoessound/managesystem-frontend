<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/ctrip-seeklogo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>携程酒店管理端</title>
    
    <!-- 安全相关的 Meta 标签 -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-Frame-Options" content="DENY" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="xss-protection" content="1; mode=block" />
    <!-- 禁止浏览器自动翻译 -->
    <meta name="google" content="notranslate" />
    
    <!-- CSP (内容安全策略) - 允许加载 blob 和 data 图片，高德地图API -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' https://*.amap.com http://*.amap.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http://localhost:8080 http://localhost:5173 https://*.amap.com http://*.amap.com; connect-src 'self' http://localhost:8080 https://*.amap.com http://*.amap.com; worker-src 'self' blob:; frame-ancestors 'none';" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
<style>
  body{
    margin:0;
  }
</style>
